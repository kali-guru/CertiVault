<div class="table-responsive"><table class="table"><thead><tr><th>Event</th><th>Outcome</th><th>Time (UTC)</th><th>Details</th></tr></thead><tbody>{% for event in events %}<tr><td>{{ event.event.replace('_',' ').title() }}</td><td><span class="badge-status">{{ event.outcome }}</span></td><td>{{ event.created.strftime('%Y-%m-%d %H:%M:%S') }}</td><td>{{ event.detail }}</td></tr>{% else %}<tr><td colspan="4" class="empty">No activity yet. Your next security action will appear here.</td></tr>{% endfor %}</tbody></table></div>
