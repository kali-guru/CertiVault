name: certivault
services:
  web:
    build: .
    image: certivault:local
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:?Run python scripts/configure.py first}
      CA_PASSPHRASE: ${CA_PASSPHRASE:?Run python scripts/configure.py first}
      APP_ENV: development
      SESSION_COOKIE_SECURE: "false"
      FLASK_DEBUG: "0"
      MAX_CONTENT_LENGTH: ${MAX_CONTENT_LENGTH:-16777216}
    volumes:
      - certivault_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 45s
volumes:
  certivault_data:
